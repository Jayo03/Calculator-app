<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <div class="display">
            <form>
                <input type="text" class="previous-input" placeholder="00" readonly />
                <input type="text" class="current-input" placeholder="00" />
            </form>
        </div>
        <div class="buttons-container">

            <div class="first-buttons">
                <table>
                    <tr>
                        <td class="first-row"><input type="button" value="e" /></td>
                        <td class="first-row"><input type="button" value="µ" /></td>
                        <td class="first-row"><input type="button" value="sin" /></td>
                    </tr>
                    <tr>
                        <td class="row ac"><input type="button" value="Ac" /></td>
                        <td class="row ac">
                            <input type="button" value="⌫">
                        </td>
                        <td class="row light-blue"><input type="button" value="/" /></td>
                    </tr>
                    <tr>
                        <td class="row"><input type="button" value="7" /></td>
                        <td class="row"><input type="button" value="8" /></td>
                        <td class="row"><input type="button" value="9" /></td>
                    </tr>
                    <tr>
                        <td class="row"><input type="button" value="4" /></td>
                        <td class="row"><input type="button" value="5" /></td>
                        <td class="row"><input type="button" value="6" /></td>
                    </tr>
                    <tr>
                        <td class="row"><input type="button" value="1" /></td>
                        <td class="row"><input type="button" value="2" /></td>
                        <td class="row"><input type="button" value="3" /></td>
                    </tr>
                    <tr>
                        <td class="row zero-btn" colspan="2"><input type="button" value="0" /></td>
                        <td class="row"><input type="button" value="." /></td>
                    </tr>
                </table>
            </div>

            <div class="side-buttons">
                <table>
                    <tr>
                        <td class="first-row"><input type="button" value="deg"></td>
                    </tr>
                    <tr>
                        <td class="row light-blue"><input type="button" value="*"></td>
                    </tr>
                    <tr>
                        <td class="row light-blue"><input type="button" value="-"></td>
                    </tr>
                    <tr>
                        <td class="row light-blue"><input type="button" value="+"></td>
                    </tr>
                    <tr></tr>
                    <tr>
                        <td class="row d-row deepblue-btn" rowspan="2"> <input type="button" value="="></td>
                    </tr>
                    <tr></tr>
                </table>
            </div>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
